server.port=${PORT:8080}
spring.datasource.url=jdbc:sqlite:${CYBERTRACE_DB_PATH:../database/cybertrace.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
cybertrace.storage=${CYBERTRACE_STORAGE:../storage/evidence}
server.error.include-message=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${CYBERTRACE_COOKIE_SECURE:false}
